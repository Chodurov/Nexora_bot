<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Заказ разработки</title>
  <style>
    .order-form {
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-family: Arial, sans-serif;
    }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 8px; box-sizing: border-box;
    }
    button {
      padding: 10px 20px; background: #0088cc; color: white; border: none; cursor: pointer; border-radius: 4px;
    }
  </style>
</head>
<body>

<div class="order-form">
  <h2>Оставить заявку на разработку</h2>
  
  <!-- Убрали action="send.php", добавили id="orderForm" -->
  <form id="orderForm">
    
    <div class="form-group">
      <label for="service">Что вы хотите заказать?</label>
      <select name="service" id="service" required>
        <option value="2D игра на Python">2D игра на Python</option>
        <option value="Разработка сайта">Разработка сайта</option>
        <option value="Личный разговор">Хочу поговорить лично</option>
      </select>
    </div>

    <div class="form-group">
      <label for="contact">Ваш Telegram или телефон для связи:</label>
      <input type="text" name="contact" id="contact" placeholder="@username или +7..." required>
    </div>

    <div class="form-group">
      <label for="details">Описание и детали заказа:</label>
      <textarea name="details" id="details" rows="5" placeholder="Например: 2D игра на Python, дизайн придумать самому, вид сбоку..." required></textarea>
    </div>

    <button type="submit">Отправить заявку</button>
  </form>
</div>

<!-- Скрипт отправки напрямую в ваш bot.py -->
<script>
  document.getElementById('orderForm').addEventListener('submit', async function(e) {
    e.preventDefault(); // Запрещаем перезагрузку и перенаправление на send.php

    const serviceInput = document.getElementById('service');
    const contactInput = document.getElementById('contact');
    const detailsInput = document.getElementById('details');

    const orderData = {
      service: serviceInput ? serviceInput.value : "Не выбрано",
      contact: contactInput ? contactInput.value : "Не указан",
      details: detailsInput ? detailsInput.value : "Без описания"
    };

    try {
      const response = await fetch('http://localhost:8080/api/order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(orderData)
      });

      const result = await response.json();

      if (result.status === 'success') {
        alert(`✅ Заявка №${result.order_id} принята! Перейдите в Telegram.`);
        // Перенаправляем клиента в бота (замени на юзернейм своего бота)
        // window.location.href = "https://t.me/WGNS_bot";
      } else {
        alert("❌ Ошибка: " + result.message);
      }
    } catch (err) {
      console.error(err);
      alert("❌ Ошибка отправки! Проверь, запущен ли bot.py в терминале.");
    }
  });
</script>

</body>
</html>
